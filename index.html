// Julian Day Number (integer, for local calendar date at noon)
function toJDN(y, m, d) {
  const a = Math.floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}
// Calibrated anchor: JDN(2024-01-01) = 2460311 => 甲子日 (cycle position 0)
const DAY_ANCHOR_JDN = 2460311;
function dayGanZhiFromJDN(jdn) {
  const cycle = ((jdn - DAY_ANCHOR_JDN) % 60 + 60) % 60;
  return {
    stemIdx: cycle % 10,
    branchIdx: cycle % 12
  };
}

// Low-precision solar apparent ecliptic longitude (Meeus ch.25), degrees [0,360)
function julianDateUTC(y, m, d, h = 12, min = 0) {
  // treats input as UT
  const dayFrac = d + (h + min / 60) / 24;
  const a = Math.floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  let jdn = dayFrac + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045 - 0.5;
  return jdn;
}
function solarLongitude(jd) {
  const T = (jd - 2451545.0) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const Mrad = M * Math.PI / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad) + (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad) + 0.000289 * Math.sin(3 * Mrad);
  const trueLong = L0 + C;
  const omega = 125.04 - 1934.136 * T;
  const lambda = trueLong - 0.00569 - 0.00478 * Math.sin(omega * Math.PI / 180);
  return (lambda % 360 + 360) % 360;
}

// Full BaZi (四柱) for a birth moment. hour may be null if unknown.
// Birth civil time is assumed to be Taiwan/China standard time (UTC+8), the convention used by virtually all BaZi practice.
const CIVIL_TZ_OFFSET = 8;
function computeBazi(y, m, d, hour, minute) {
  // day pillar: always the actual calendar day (no shift)
  const jdn = toJDN(y, m, d);
  const day = dayGanZhiFromJDN(jdn);
  const jd = julianDateUTC(y, m, d, (hour ?? 12) - CIVIL_TZ_OFFSET, minute ?? 0);
  const lambda = solarLongitude(jd);
  const adjusted = ((lambda - 315) % 360 + 360) % 360;
  const monthIndex = Math.floor(adjusted / 30); // 0=寅 ... 11=丑
  const monthBranchIdx = (2 + monthIndex) % 12;

  // ganzhi year (立春 boundary)
  let ganzhiYear = y;
  if (m === 1) ganzhiYear = y - 1;else if (m === 2 && monthIndex === 11) ganzhiYear = y - 1;
  const yearStemIdx = ((ganzhiYear - 4) % 10 + 10) % 10;
  const yearBranchIdx = ((ganzhiYear - 4) % 12 + 12) % 12;

  // month stem via 五虎遁
  const firstMonthStem = [2, 4, 6, 8, 0][yearStemIdx % 5];
  const monthStemIdx = (firstMonthStem + monthIndex) % 10;
  let hourPillar = null;
  if (hour !== null && hour !== undefined) {
    const hourBranchIdx = Math.floor((hour + 1) % 24 / 2);
    // 夜子時 (23:00–23:59): the hour-stem is derived as if it were the next day's 子時,
    // even though the day pillar shown still belongs to the current calendar day.
    let stemBaseIdx = day.stemIdx;
    if (hour === 23) {
      const nd = new Date(Date.UTC(y, m - 1, d + 1));
      const nJdn = toJDN(nd.getUTCFullYear(), nd.getUTCMonth() + 1, nd.getUTCDate());
      stemBaseIdx = dayGanZhiFromJDN(nJdn).stemIdx;
    }
    const baseHourStem = [0, 2, 4, 6, 8][stemBaseIdx % 5];
    const hourStemIdx = (baseHourStem + hourBranchIdx) % 10;
    hourPillar = {
      stemIdx: hourStemIdx,
      branchIdx: hourBranchIdx
    };
  }
  return {
    year: {
      stemIdx: yearStemIdx,
      branchIdx: yearBranchIdx
    },
    month: {
      stemIdx: monthStemIdx,
      branchIdx: monthBranchIdx
    },
    day,
    hour: hourPillar,
    ganzhiYear,
    meta: {
      jd,
      monthIndex
    }
  };
}

// Bisection root-finder for "when does the sun's longitude equal target degrees" (used for 大運 start-age)
function findLongitudeCrossing(jdLow, jdHigh, targetDeg) {
  function diff(jd) {
    let dlt = solarLongitude(jd) - targetDeg;
    return (dlt + 540) % 360 - 180; // normalize to (-180,180]
  }
  let a = jdLow,
    b = jdHigh,
    fa = diff(a);
  for (let i = 0; i < 50; i++) {
    const mid = (a + b) / 2;
    const fm = diff(mid);
    if (fa <= 0 && fm >= 0 || fa >= 0 && fm <= 0) {
      b = mid;
    } else {
      a = mid;
      fa = fm;
    }
  }
  return (a + b) / 2;
}

// 大運 (10-year luck pillars): direction depends on year-stem polarity + gender, start age from distance to the adjacent 節.
function computeDayun(bazi, isMale) {
  const yearYang = STEM_YY[bazi.year.stemIdx] === "陽";
  const forward = yearYang && isMale || !yearYang && !isMale;
  const {
    jd,
    monthIndex
  } = bazi.meta;
  const lowerDeg = (315 + monthIndex * 30) % 360;
  const upperDeg = (lowerDeg + 30) % 360;
  let diffDays;
  if (forward) {
    const crossJD = findLongitudeCrossing(jd, jd + 40, upperDeg);
    diffDays = crossJD - jd;
  } else {
    const crossJD = findLongitudeCrossing(jd - 40, jd, lowerDeg);
    diffDays = jd - crossJD;
  }
  const totalMonths = Math.max(0, Math.round(diffDays / 3 * 12));
  const startYears = Math.floor(totalMonths / 12);
  const startMonths = totalMonths % 12;
  const startAgeDecimal = totalMonths / 12;
  const periods = [];
  const step = forward ? 1 : -1;
  for (let i = 0; i < 8; i++) {
    const stemIdx = ((bazi.month.stemIdx + step * (i + 1)) % 10 + 10) % 10;
    const branchIdx = ((bazi.month.branchIdx + step * (i + 1)) % 12 + 12) % 12;
    periods.push({
      stemIdx,
      branchIdx,
      startAge: Math.round(startAgeDecimal + i * 10),
      endAge: Math.round(startAgeDecimal + i * 10 + 9)
    });
  }
  return {
    forward,
    startYears,
    startMonths,
    periods
  };
}
function pillarLabel(p) {

  return STEMS[p.stemIdx] + BRANCHES[p.branchIdx];

function tenGod(dayMasterIdx, otherStemIdx) {
  if (dayMasterIdx === otherStemIdx) return "比肩";
  const dmEl = STEM_ELEMENT[dayMasterIdx],
    dmYY = STEM_YY[dayMasterIdx];
  const otEl = STEM_ELEMENT[otherStemIdx],
    otYY = STEM_YY[otherStemIdx];
  const same = dmYY === otYY;
  if (otEl === dmEl) return same ? "比肩" : "劫財";
  if (GENERATES[dmEl] === otEl) return same ? "食神" : "傷官";
  if (GENERATES[otEl] === dmEl) return same ? "偏印" : "正印";
  if (OVERCOMES[dmEl] === otEl) return same ? "偏財" : "正財";
  if (OVERCOMES[otEl] === dmEl) return same ? "七殺" : "正官";
  return "比肩";
}

function elementCounts(bazi) {

    土: 0,
    金: 0,
    水: 0

  const pillars = [bazi.year, bazi.month, bazi.day, bazi.hour].filter(Boolean);

  const favorable = strong ? [outputEl, wealthEl, officerEl] : [dmEl, resourceEl];
  const unfavorable = strong ? [dmEl, resourceEl] : [outputEl, wealthEl, officerEl];
  return {
    strong,
    ratio,
    favorable,
    unfavorable,
    dmEl
  };
}
