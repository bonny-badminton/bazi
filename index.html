  const firstMonthStem = [2, 4, 6, 8, 0][yearStemIdx % 5];
  const monthStemIdx = (firstMonthStem + monthIndex) % 10;
  let hourPillar = null;
  if (hour !== null && hour !== undefined) {
    const hourBranchIdx = Math.floor((hour + 1) % 24 / 2);
    // 夜子時 (23:00–23:59): the hour-stem is derived as if it were the next day's 子時,
    // even though the day pillar shown still belongs to the current calendar day.
    let stemBaseIdx = day.stemIdx;
    if (hour === 23) {
      const nd = new Date(Date.UTC(y, m - 1, d + 1));
      const nJdn = toJDN(nd.getUTCFullYear(), nd.getUTCMonth() + 1, nd.getUTCDate());
      stemBaseIdx = dayGanZhiFromJDN(nJdn).stemIdx;
    }
    const baseHourStem = [0, 2, 4, 6, 8][stemBaseIdx % 5];
    const hourStemIdx = (baseHourStem + hourBranchIdx) % 10;
    hourPillar = {
      stemIdx: hourStemIdx,
      branchIdx: hourBranchIdx
    };
  }
  return {
    year: {
      stemIdx: yearStemIdx,
      branchIdx: yearBranchIdx
    },
    month: {
      stemIdx: monthStemIdx,
      branchIdx: monthBranchIdx
    },
    day,
    hour: hourPillar,
    ganzhiYear,
    meta: {
      jd,
      monthIndex
    }
  };
}

// Bisection root-finder for "when does the sun's longitude equal target degrees" (used for 大運 start-age)
function findLongitudeCrossing(jdLow, jdHigh, targetDeg) {
  function diff(jd) {
    let dlt = solarLongitude(jd) - targetDeg;
    return (dlt + 540) % 360 - 180; // normalize to (-180,180]
  }
  let a = jdLow,
    b = jdHigh,
    fa = diff(a);
  for (let i = 0; i < 50; i++) {
    const mid = (a + b) / 2;
    const fm = diff(mid);
    if (fa <= 0 && fm >= 0 || fa >= 0 && fm <= 0) {
      b = mid;
    } else {
      a = mid;
      fa = fm;
    }
  }
  return (a + b) / 2;
}

// 大運 (10-year luck pillars): direction depends on year-stem polarity + gender, start age from distance to the adjacent 節.
function computeDayun(bazi, isMale) {
  const yearYang = STEM_YY[bazi.year.stemIdx] === "陽";
  const forward = yearYang && isMale || !yearYang && !isMale;
  const {
    jd,
    monthIndex
  } = bazi.meta;
  const lowerDeg = (315 + monthIndex * 30) % 360;
  const upperDeg = (lowerDeg + 30) % 360;
  let diffDays;
  if (forward) {
    const crossJD = findLongitudeCrossing(jd, jd + 40, upperDeg);
    diffDays = crossJD - jd;
  } else {
    const crossJD = findLongitudeCrossing(jd - 40, jd, lowerDeg);
    diffDays = jd - crossJD;
  }
  const totalMonths = Math.max(0, Math.round(diffDays / 3 * 12));
  const startYears = Math.floor(totalMonths / 12);
  const startMonths = totalMonths % 12;
  const startAgeDecimal = totalMonths / 12;
  const periods = [];
  const step = forward ? 1 : -1;
  for (let i = 0; i < 8; i++) {
    const stemIdx = ((bazi.month.stemIdx + step * (i + 1)) % 10 + 10) % 10;
    const branchIdx = ((bazi.month.branchIdx + step * (i + 1)) % 12 + 12) % 12;
    periods.push({
      stemIdx,
      branchIdx,
      startAge: Math.round(startAgeDecimal + i * 10),
      endAge: Math.round(startAgeDecimal + i * 10 + 9)
    });
  }
  return {
    forward,
    startYears,
    startMonths,
    periods
  };
}

function eclipticLongitudeToSign(lon) {

// 上升星座：需要精確出生時刻＋出生地經緯度。演算法：以「正東方地平線」為觀測方向，
// 依序從地平座標轉赤道座標（依觀測者經緯度）、再轉黃道座標，取得的黃經即為上升點。
function computeAscendantLongitude(dateUTC, lat, lng) {
  const time = window.Astronomy.MakeTime(dateUTC);
  const observer = new window.Astronomy.Observer(lat, lng, 0);
  const sphere = new window.Astronomy.Spherical(0, 90, 1); // 地平：高度0、方位角90（正東）
  const horVec = window.Astronomy.VectorFromHorizon(sphere, time, null);
  const rotHorEqd = window.Astronomy.Rotation_HOR_EQD(time, observer);
  const eqdVec = window.Astronomy.RotateVector(rotHorEqd, horVec);
  const rotEqdEcl = window.Astronomy.Rotation_EQD_ECL(time);
  const eclVec = window.Astronomy.RotateVector(rotEqdEcl, eqdVec);
  const s = window.Astronomy.SphereFromVector(eclVec);
  return (s.lon % 360 + 360) % 360;
}

// 出生民用時間（預設台灣／中國 UTC+8，與八字引擎一致）轉換為 UTC 的 Date 物件

  const {
    y,
    m,
    d,
    h,
    min
  } = profile.birth;
  const hour = profile.hasTime ? h : 12;
  const minute = profile.hasTime ? min : 0;
  return new Date(Date.UTC(y, m - 1, d, hour - CIVIL_TZ_OFFSET, minute));
}
function computeNatalChart(profile) {
  if (!ASTRO_AVAILABLE) return null;
  const dateUTC = birthToUTCDate(profile);
  const planets = {};
  PLANET_BODIES.forEach(({
    key,
    body
  }) => {
    planets[key] = eclipticLongitudeToSign(getBodyLongitude(body, dateUTC));
  });
  let ascendant = null;
  if (profile.hasTime && profile.location && profile.location.lat != null && profile.location.lng != null) {
    ascendant = eclipticLongitudeToSign(computeAscendantLongitude(dateUTC, profile.location.lat, profile.location.lng));
  }
  return {
    planets,
    ascendant,
    dateUTC
  };
}
function astroElementCounts(natal) {
  const counts = {

    土: 0,
    風: 0,
    水: 0
  };
  Object.values(natal.planets).forEach(p => {
    counts[ZODIAC_ELEMENT[p.signIdx]]++;
  });
  if (natal.ascendant) counts[ZODIAC_ELEMENT[natal.ascendant.signIdx]]++;
  return counts;
}

const ASPECTS = [{
  name: "合相",
  angle: 0,
  orb: 8,
  type: "neutral"
}, {
  name: "六分相",
  angle: 60,
  orb: 6,

}];
function findAspect(lonA, lonB) {
  let diff = Math.abs(lonA - lonB) % 360;
  if (diff > 180) diff = 360 - diff;
  let best = null;
  for (const a of ASPECTS) {
    const delta = Math.abs(diff - a.angle);
    if (delta <= a.orb && (!best || delta < best.delta)) best = {
      ...a,
      delta
    };
  }
  return best;
}

  if (!aspect) return 0;
  if (aspect.type === "harmonious") return BENEFIC.includes(transitKey) ? 2.5 : 2;
  if (aspect.type === "tense") return MALEFIC.includes(transitKey) ? -2.5 : BENEFIC.includes(transitKey) ? 1 : -1.5;
  if (BENEFIC.includes(transitKey)) return 1.5;
  if (MALEFIC.includes(transitKey)) return -1.5;
  return 0;
}

// 月亮那組相位的「參照點」特意分散在本命太陽／本命上升／本命月亮三者之間（而非只用太陽、上升兩點），

function buildAstroFortune(natal, transitDateUTC, unit) {
  if (!natal) return null;
  const categoryPairs = unit === "日" ? ASTRO_CATEGORY_PAIRS_DAY : ASTRO_CATEGORY_PAIRS_YEAR;
  const transitKeys = ["sun", "moon", "mercury", "venus", "mars", "jupiter"];
  const transits = {};
  transitKeys.forEach(key => {
    const body = PLANET_BODIES.find(p => p.key === key).body;

  };
  const hasRealAsc = !!natal.ascendant;
  const scores = {};

  Object.entries(categoryPairs).forEach(([cat, pairs]) => {
    let score = 3;
    let strongest = null;
    const pairResults = [];
    pairs.forEach(([tKey, nKey]) => {
      const aspect = findAspect(transits[tKey].lon, natalRef[nKey]);
      pairResults.push({
        transitKey: tKey,
        natalKey: nKey,
        aspect

      if (aspect) {

        if (!strongest || aspect.delta < strongest.aspect.delta) strongest = {
          transitKey: tKey,
          natalKey: nKey,
          aspect
        };

    details[cat] = {
      pairs: pairResults,
      strongest
    };
  });
  const moonSign = transits.moon;
  const headline = `${PLANET_LABEL.moon}在${moonSign.sign}`;
  return {
    transits,
    scores,
    details,
    natalRef,
    hasRealAsc,
    moonSign,
    unit
  };
}

// 行星週期（對應八字「大運」）：以每十年為一區塊，取區塊中點年份的木星／土星位置
// 與本命太陽形成的相位，作為該十年的長期基調；並標註土星回歸等知名占星里程碑。
function computeAstroCycles(natal, birthYear) {
  if (!natal) return null;
  const periods = [];
  for (let i = 0; i < 8; i++) {
    const startAge = i * 10;
    const midAge = startAge + 5;
    const dateUTC = new Date(Date.UTC(birthYear + midAge, 5, 15, 4, 0, 0));
    const jup = eclipticLongitudeToSign(getBodyLongitude("Jupiter", dateUTC));
    const sat = eclipticLongitudeToSign(getBodyLongitude("Saturn", dateUTC));
    const jupAspect = findAspect(jup.lon, natal.planets.sun.lon);
    const satAspect = findAspect(sat.lon, natal.planets.sun.lon);
    const landmarks = [];
    if (startAge <= 30 && startAge + 9 >= 29) landmarks.push("土星回歸期（約29–30歲）");
    if (startAge <= 42 && startAge + 9 >= 41) landmarks.push("天王星對分相（約41–43歲，占星傳統上的「中年轉折」）");
    if (startAge <= 59 && startAge + 9 >= 58) landmarks.push("第二次土星回歸（約58–60歲）");
    periods.push({
      startAge,
      endAge: startAge + 9,
      jup,
      sat,
      jupAspect,
      satAspect,
      landmarks
    });
  }
  return periods;
}

// 重新以此為命宮起點排列成一組新的十二宮（宮名重新分配，星曜本身不會移動，只是換了一批標籤）。
function buildZiweiFlowPalaces(anchorBranchIdx, ziwei) {
  return PALACE_NAMES.map((name, i) => {
    const branchIdx = ((anchorBranchIdx - i) % 12 + 12) % 12;
    const natal = ziwei.palaces.find(p => p.branchIdx === branchIdx);
    return {
      name,
      branchIdx,
      stars: natal ? natal.stars : [],
      luckyStars: natal ? natal.luckyStars : [],
      harshStars: natal ? natal.harshStars : [],
      sihuaTags: natal ? natal.sihuaTags : []
    };
  });
}
function ziweiPalaceScore(palace) {
  if (!palace) return {
    score: 3,
    weight: 0
  };
  let w = 0;
  palace.stars.forEach(s => w += MAIN_STAR_INFO[s].weight);
  palace.luckyStars.forEach(s => w += LUCKY_STAR_INFO[s].weight);
  palace.harshStars.forEach(s => w += HARSH_STAR_INFO[s].weight);
  palace.sihuaTags.forEach(t => w += SIHUA_WEIGHT[t.tag] || 0);
  const score = Math.max(1, Math.min(5, Math.round(3 + w / 2)));
  return {
    score,
    weight: w
  };
}

function computeZiweiFortune(ziwei, anchorBranchIdx) {
  const flowPalaces = buildZiweiFlowPalaces(anchorBranchIdx, ziwei);
  const scores = {};
  const details = {};
  Object.entries(ZIWEI_FORTUNE_CATEGORY_PALACE).forEach(([cat, palaceName]) => {
    const p = flowPalaces.find(fp => fp.name === palaceName);
    const {
      score
    } = ziweiPalaceScore(p);
    scores[cat] = score;
    details[cat] = {
      palace: p
    };
  });
  return {
    flowPalaces,
    scores,
    details
  };
}

// 計算「整張命盤」的十神分布（年、月、時天干 + 年月日時地支藏干，皆相對於日主計算，權重加總）。

// 用於工作事業適配、財運分類這類「看整張命盤格局」的靜態分析，區別於逐日／逐年的流運分析。
function computeNatalTenGodProfile(bazi) {
  const dm = bazi.day.stemIdx;
  const profile = {};
  TEN_GODS_LIST.forEach(g => profile[g] = 0);
  const stemPillars = [bazi.year.stemIdx, bazi.month.stemIdx, bazi.hour.stemIdx];
  stemPillars.forEach(idx => {
    if (idx === undefined || idx === null) return;
    profile[tenGod(dm, idx)] += 1;
  });
  const branchPillars = [bazi.year.branchIdx, bazi.month.branchIdx, bazi.day.branchIdx, bazi.hour.branchIdx];
  branchPillars.forEach(bIdx => {
    if (bIdx === undefined || bIdx === null) return;
    BRANCH_HIDDEN_STEMS[bIdx].forEach(({
      stem,
      w
    }) => {
      profile[tenGod(dm, stem)] += w;
    });
  });
  const groups = {
    比劫: profile.比肩 + profile.劫財,
    食傷: profile.食神 + profile.傷官,
    財: profile.正財 + profile.偏財,
    官殺: profile.正官 + profile.七殺,
    印: profile.偏印 + profile.正印
  };
  const sortedGods = [...TEN_GODS_LIST].sort((a, b) => profile[b] - profile[a]);
  return {
    profile,
    groups,
    topGod: sortedGods[0],
    secondGod: sortedGods[1]
  };
}

  if (dayMasterIdx === otherStemIdx) return "比肩";
  const dmEl = STEM_ELEMENT[dayMasterIdx],

  if (GENERATES[otEl] === dmEl) return same ? "偏印" : "正印";
  if (OVERCOMES[dmEl] === otEl) return same ? "偏財" : "正財";

}

  };
}

    text: WEAK_GROUP_WATCHOUT[weakestGroup],
    from: `依整張命盤中力量最弱的十神群組「${weakestGroup}」`

  const opportunities = [{
    text: firstFavorable ? `持續強化「${firstFavorable}」相關的五行能量（可參考上方的五行生活建議），是近期最容易借力使力、放大優勢的方向。` : "留意大運流年補進喜用神的時間點，那會是運勢相對明顯轉強的階段。",

   五行統計、身強身弱、用神喜忌
   ============================================================ */
function elementCounts(bazi) {
  const counts = {
    木: 0,
    火: 0,
    土: 0,
    金: 0,
    水: 0
  };
  const pillars = [bazi.year, bazi.month, bazi.day, bazi.hour].filter(Boolean);
  pillars.forEach(p => {
    counts[STEM_ELEMENT[p.stemIdx]]++;
    counts[BRANCH_ELEMENT[p.branchIdx]]++;
  });
  return counts;
}

// 簡化版「身強身弱」與用神喜忌判斷（扶抑法）：僅供參考，非嚴謹排盤的完整用神推算
function analyzeStrength(bazi) {
  const dmEl = STEM_ELEMENT[bazi.day.stemIdx];
  const pillars = [bazi.year, bazi.month, bazi.day, bazi.hour].filter(Boolean);
  let supportive = 0,
    total = 0;
  pillars.forEach(p => {
    [STEM_ELEMENT[p.stemIdx], BRANCH_ELEMENT[p.branchIdx]].forEach(el => {
      total++;
      if (el === dmEl || GENERATES[el] === dmEl) supportive++;
    });
  });
  // 日主本身的天干不計入他生支持（已是自己），修正一次
  total -= 1;
  supportive -= 1;
  const ratio = supportive / total;
  const strong = ratio >= 0.45;
  const outputEl = GENERATES[dmEl]; // 食傷
  const wealthEl = OVERCOMES[dmEl]; // 財
  const officerEl = Object.keys(OVERCOMES).find(k => OVERCOMES[k] === dmEl); // 官殺
  const resourceEl = Object.keys(GENERATES).find(k => GENERATES[k] === dmEl); // 印

  const favorable = strong ? [outputEl, wealthEl, officerEl] : [dmEl, resourceEl];
  const unfavorable = strong ? [dmEl, resourceEl] : [outputEl, wealthEl, officerEl];
  return {
    strong,
    ratio,
    favorable,
    unfavorable,
    dmEl
  };
}

function useIsWide() {
  const [isWide, setIsWide] = useState(() => typeof window !== "undefined" && window.innerWidth >= 820);
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(min-width: 820px)");
    const handler = e => setIsWide(e.matches);
    setIsWide(mq.matches);
    if (mq.addEventListener) mq.addEventListener("change", handler);else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", handler);else mq.removeListener(handler);
    };
  }, []);
  return isWide;
}
